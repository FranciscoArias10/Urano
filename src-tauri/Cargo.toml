[package]
name = "urano"
version = "0.1.0"
description = "Urano - Local-First Markdown Notes with Google Drive Sync"
authors = ["Urano"]
edition = "2021"

[lib]
name = "urano_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
notify = "6"
md-5 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tiny_http = "0.12"
walkdir = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
open = "5"
urlencoding = "2.1"

